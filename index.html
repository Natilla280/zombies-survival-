<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ZOMBIE SURVIVAL</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 900, H = 600;
canvas.width = W;
canvas.height = H;

// ── offscreen for darkness ──
const dark = document.createElement('canvas');
dark.width = W; dark.height = H;
const dctx = dark.getContext('2d');

// ── INPUT ──
const keys = {};
const mouse = { x: W/2, y: H/2, down: false, clicked: false };

window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup',   e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mousedown', e => { mouse.down = true; mouse.clicked = true; });
canvas.addEventListener('mouseup',   e => { mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('wheel', e => {
  if (gs !== 'PLAY') return;
  const d = e.deltaY > 0 ? 1 : -1;
  pl.wi = (pl.wi + d + pl.weps.length) % pl.weps.length;
});
window.addEventListener('keydown', e => {
  if (gs !== 'PLAY') return;
  const n = parseInt(e.key);
  if (n >= 1 && n <= pl.weps.length) pl.wi = n - 1;
});

// ── GAME STATE ──
let gs = 'MENU'; // MENU PLAY OVER WIN
let round = 0, roundTimer = 0, totalKills = 0, roundKills = 0;
let killBattery = 0;
let spawnT = 0, spawnInterval = 4;
let nextRound = 0; // countdown between rounds
let announce = '', announceT = 0;

// ── WORLD ──
const WW = 1600, WH = 1600;
let cam = { x: 0, y: 0 };

// ── MAP DATA ──
const buildings = [];
const trees = [];

function buildMap() {
  buildings.length = 0;
  trees.length = 0;

  // Houses
  buildings.push({ x:150, y:150, w:130, h:100, type:'house', c:'#7B6B55' });
  buildings.push({ x:500, y:250, w:120, h:90,  type:'house', c:'#5A7B55' });
  buildings.push({ x:200, y:750, w:140, h:110, type:'house', c:'#6B5566' });
  buildings.push({ x:1000,y:200, w:130, h:100, type:'house', c:'#55667B' });
  // Gas station
  buildings.push({ x:1100,y:1000,w:200, h:140, type:'gas',   c:'#C8A84B' });

  // Trees scattered
  const tpos = [
    [80,400],[80,500],[160,450],[300,100],[400,80],[700,100],[900,150],
    [1200,300],[1400,200],[1450,500],[1400,800],[1300,1200],[1000,1400],
    [700,1450],[400,1350],[100,1200],[80,900],[80,700],[350,550],[450,650],
    [600,500],[750,400],[850,600],[950,800],[1100,600],[1250,750],[600,900],
    [750,1100],[500,1050],[300,900],[1350,1050],[1450,1100],[1200,1500],
    [900,1300],[700,1250],[400,1150],[200,1350],[1500,1300],[1500,700],
  ];
  tpos.forEach(([x,y]) => trees.push({ x, y }));
}

// ── PLAYER ──
let pl = {};

function initPlayer() {
  pl = {
    x: WW/2, y: WH/2,
    hp: 200, maxHp: 200,
    spd: 130,
    angle: 0,
    r: 13,
    iframes: 0,
    trapped: 0,
    flashT: 0,
    alive: true,
    weps: [makeWep('PISTOL')],
    wi: 0,
    // battery
    bat: 100, batMax: 100, batDrain: 1.5,
  };
}

// ── WEAPONS ──
const WEP_DATA = {
  PISTOL:  { name:'Pistola',      dmg:25,  rate:0.38, ammo:-1, auto:false, col:'#FFEE44', icon:'🔫' },
  RIFLE:   { name:'Rifle',        dmg:50,  rate:0.18, ammo:90, auto:true,  col:'#CC9922', icon:'🎯' },
  SHOTGUN: { name:'Escopeta',     dmg:100, rate:0.85, ammo:40, auto:false, col:'#AA6622', icon:'💥' },
  MOLOTOV: { name:'Molotov',      dmg:10,  rate:1.4,  ammo:6,  auto:false, col:'#FF6600', icon:'🔥' },
  ICE:     { name:'Rifle Hielo',  dmg:5,   rate:0.45, ammo:30, auto:false, col:'#88DDFF', icon:'❄️' },
  RPG:     { name:'RPG',          dmg:250, rate:1.8,  ammo:5,  auto:false, col:'#FF2222', icon:'🚀' },
  FLAME:   { name:'Lanzallamas',  dmg:20,  rate:0.07, ammo:200,auto:true,  col:'#FF6600', icon:'🌋' },
  BAT:     { name:'Bate Elec.',   dmg:50,  rate:0.75, ammo:-1, auto:false, col:'#FFFF22', icon:'⚡' },
};

function makeWep(type) {
  const d = WEP_DATA[type];
  return { type, ...d, maxAmmo: d.ammo, cd: 0 };
}

// ── BULLETS / PROJECTILES ──
let bullets = [];
let particles = [];
let fires = [];  // fire zones on ground
let webs = [];   // web trap markers

function fireWeapon() {
  const w = pl.weps[pl.wi];
  if (!w || w.cd > 0 || w.ammo === 0) return;
  w.cd = w.rate;
  if (w.ammo > 0) w.ammo--;

  const ox = pl.x + Math.cos(pl.angle)*18;
  const oy = pl.y + Math.sin(pl.angle)*18;
  const a  = pl.angle;

  if (w.type === 'PISTOL' || w.type === 'RIFLE') {
    bullets.push({ x:ox, y:oy, vx:Math.cos(a)*440, vy:Math.sin(a)*440,
      type:'bullet', dmg:w.dmg, life:1.4, player:true, col:'#FFE020', r:4 });
  }
  else if (w.type === 'SHOTGUN') {
    for (let i=0;i<8;i++) {
      const sa = a + (Math.random()-0.5)*0.5;
      bullets.push({ x:ox, y:oy, vx:Math.cos(sa)*380, vy:Math.sin(sa)*380,
        type:'shotgun', dmg:w.dmg, life:0.35, player:true, col:'#FFA020', r:5,
        bx:ox, by:oy });
    }
  }
  else if (w.type === 'MOLOTOV') {
    bullets.push({ x:ox, y:oy, vx:Math.cos(a)*190, vy:Math.sin(a)*190,
      type:'molotov', dmg:w.dmg, life:2.2, player:true, col:'#FF6600', r:6 });
  }
  else if (w.type === 'ICE') {
    bullets.push({ x:ox, y:oy, vx:Math.cos(a)*400, vy:Math.sin(a)*400,
      type:'ice', dmg:w.dmg, life:1.4, player:true, col:'#88DDFF', r:5 });
  }
  else if (w.type === 'RPG') {
    bullets.push({ x:ox, y:oy, vx:Math.cos(a)*260, vy:Math.sin(a)*260,
      type:'rocket', dmg:w.dmg, life:3, player:true, col:'#FF2222', r:7 });
  }
  else if (w.type === 'FLAME') {
    for (let i=0;i<3;i++) {
      const fa = a + (Math.random()-0.5)*0.55;
      const fs = 90 + Math.random()*80;
      bullets.push({ x:ox, y:oy, vx:Math.cos(fa)*fs, vy:Math.sin(fa)*fs,
        type:'flame', dmg:w.dmg, life:0.4+Math.random()*0.25, player:true,
        col:'#FF5500', r:7+Math.random()*5 });
    }
  }
  else if (w.type === 'BAT') {
    // Melee arc
    for (let i=-4;i<=4;i++) {
      const ba = a + i*0.18;
      bullets.push({ x:pl.x+Math.cos(ba)*50, y:pl.y+Math.sin(ba)*50,
        vx:0, vy:0, type:'bat', dmg:w.dmg, life:0.1, player:true, col:'#FFFF22', r:20 });
    }
  }
}

// ── ZOMBIES ──
let zombies = [];
let zid = 0;

const ZD = {
  NORMAL:   { hp:100, spd:52,  dmg:25, r:13, col:'#3A7A2A', hcol:'#5A9A4A', sc:1.0 },
  CHILD:    { hp:50,  spd:95, dmg:25, r:8,  col:'#3A7A4A', hcol:'#5A9A6A', sc:0.9 },
  FAT:      { hp:150, spd:36,  dmg:25, r:20, col:'#2A5A1A', hcol:'#4A7A3A', sc:1.6 },
  PREGNANT: { hp:150, spd:42,  dmg:25, r:15, col:'#4A7A3A', hcol:'#6A9A5A', sc:1.2 },
  ARMORED:  { hp:100, spd:48,  dmg:25, r:13, col:'#3A4A6A', hcol:'#5A6A8A', sc:1.1 },
  SCIENTIST:{ hp:110, spd:52,  dmg:25, r:12, col:'#8A8A50', hcol:'#AAAA70', sc:1.0 },
  KAMIKAZE: { hp:10,  spd:115, dmg:30, r:9,  col:'#8A3A2A', hcol:'#AA5A4A', sc:0.7 },
  SPIDER:   { hp:120, spd:62,  dmg:20, r:11, col:'#3A3A5A', hcol:'#5A5A7A', sc:1.0 },
  BIGHEAD:  { hp:60,  spd:78,  dmg:0,  r:15, col:'#4A7A3A', hcol:'#AAAA2A', sc:1.2 },
  BOSS:     { hp:800, spd:58,  dmg:40, r:34, col:'#1A3A0A', hcol:'#3A6A2A', sc:2.6 },
};

function spawnZ(type, pos) {
  const d = ZD[type];
  const p = pos || edgeSpawn();
  zombies.push({
    id: zid++, type,
    x: p.x, y: p.y,
    hp: d.hp, maxHp: d.hp,
    spd: d.spd, dmg: d.dmg, r: d.r,
    col: d.col, hcol: d.hcol, sc: d.sc,
    vx:0, vy:0, angle:0,
    flash:0, frozen:0, thaw:0, stun:0,
    burning:false, burnT:0,
    dead:false,
    atkT:0,
    // type specials
    armorHits: type==='ARMORED' ? 3 : 0,
    armorOff: false,
    spawnT: type==='PREGNANT' ? 5 : 0,
    throwT: 0,
    screamT: type==='BIGHEAD' ? 3 : 0,
    summonT: type==='BOSS' ? 9 : 0,
    webT: (type==='SPIDER'||type==='BOSS') ? 4 : 0,
    exploded: false,
  });
}

function edgeSpawn() {
  const e = Math.floor(Math.random()*4);
  if (e===0) return { x: Math.random()*WW, y: 5 };
  if (e===1) return { x: Math.random()*WW, y: WH-5 };
  if (e===2) return { x: 5,    y: Math.random()*WH };
  return             { x: WW-5, y: Math.random()*WH };
}

// ── PICKUPS ──
let pickups = [];

function placePicks() {
  pickups = [];
  const medPos = [[300,300],[900,400],[700,1100],[1400,600],[500,1300],[1200,900],[200,1000],[1300,300]];
  medPos.forEach(([x,y]) => pickups.push({ x, y, type:'med' }));

  const wepList = [
    [650,450,'RIFLE'],[1000,300,'SHOTGUN'],[350,1200,'MOLOTOV'],
    [1400,800,'BAT'],[800,1300,'MOLOTOV'],
  ];
  const specials = [['ICE',550,1450],['RPG',1250,1350],['FLAME',200,1300]];
  specials.forEach(([t,x,y]) => { if (Math.random()<0.7) wepList.push([x,y,t]); });
  wepList.forEach(([x,y,t]) => pickups.push({ x, y, type:'wep', wt:t }));
}

// ── ROUND SPAWN ──
const ROUND_NAMES = [
  '','RONDA 1 — Los Muertos','RONDA 2 — Niños Zombies',
  'RONDA 3 — Los Gordos','RONDA 4 — La Madre',
  'RONDA 5 — Blindados','RONDA 6 — Ciencia Muerta',
  'RONDA 7 — KAMIKAZES','RONDA 8 — Telarañas',
  'RONDA 9 — El Gritón','☠ RONDA 10 — PACIENTE CERO',
];

function startRound(r) {
  round = r;
  roundTimer = 35;
  roundKills = 0;
  spawnT = 1.5;
  spawnInterval = Math.max(1.1, 5 - r*0.35);
  announce = ROUND_NAMES[r] || `RONDA ${r}`;
  announceT = 3.5;
  zombies = [];
  bullets = [];
  fires = [];
  webs = [];
  particles = [];
  if (r===10) spawnZ('BOSS', { x:WW/2+400, y:WH/2+300 });
}

function spawnWave() {
  const count = Math.min(2+round, 7);
  for (let i=0; i<count; i++) spawnForRound();
}

function spawnForRound() {
  const r = round, v = Math.random();
  let t = 'NORMAL';
  if      (r===1) t='NORMAL';
  else if (r===2) t = v<0.45?'CHILD':'NORMAL';
  else if (r===3) t = v<0.3?'FAT':v<0.5?'CHILD':'NORMAL';
  else if (r===4) t = v<0.25?'PREGNANT':v<0.45?'CHILD':'NORMAL';
  else if (r===5) t = v<0.4?'ARMORED':v<0.6?'CHILD':'NORMAL';
  else if (r===6) t = v<0.35?'SCIENTIST':v<0.55?'CHILD':'NORMAL';
  else if (r===7) t = v<0.38?'KAMIKAZE':v<0.55?'FAT':'NORMAL';
  else if (r===8) t = v<0.38?'SPIDER':v<0.55?'KAMIKAZE':'NORMAL';
  else if (r===9) t = v<0.22?'BIGHEAD':v<0.44?'SPIDER':'NORMAL';
  else            t = v<0.15?'FAT':v<0.3?'ARMORED':v<0.45?'SCIENTIST':v<0.55?'SPIDER':'NORMAL';
  spawnZ(t);
}

// ── HELPERS ──
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const dist  = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

function puff(x,y,n,col,spd) {
  for (let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2;
    const s = Math.random()*spd;
    const life = 0.3+Math.random()*0.4;
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life, ml:life, col, sz:2+Math.random()*4 });
  }
}

function hurtPlayer(dmg, useIF=true) {
  if (!pl.alive) return;
  if (useIF && pl.iframes>0) return;
  pl.hp -= dmg;
  pl.flashT = 0.15;
  if (useIF) pl.iframes = 0.45;
  if (pl.hp <= 0) { pl.hp=0; pl.alive=false; }
}

function hurtZombie(z, dmg, type) {
  if (z.dead) return;
  // Armored: absorb until broken
  if (z.type==='ARMORED' && !z.armorOff) {
    z.armorHits--;
    puff(z.x,z.y,4,'#8888FF',25);
    if (z.armorHits<=0) z.armorOff=true;
    return;
  }
  z.hp -= dmg;
  z.flash = 0.13;
  if (type==='ice')    { z.frozen=4; z.thaw=3; }
  if (type==='flame'||type==='molotov') { z.burning=true; z.burnT=9999; }
  if (type==='bat')    { z.stun=5; }
  if (z.hp<=0) killZ(z);
}

function killZ(z) {
  if (z.dead) return;
  z.dead = true;
  totalKills++;
  roundKills++;
  killBattery++;
  if (killBattery>=6) { killBattery=0; dropBattery(z); }
  puff(z.x, z.y, 8, '#70A040', 35);

  if (z.type==='FAT') {
    puff(z.x,z.y,25,'#FF6010',90);
    if (dist(z,pl)<80) hurtPlayer(25,false);
  }
  if (z.type==='PREGNANT') {
    spawnZ('CHILD',{x:z.x+20,y:z.y+20});
    spawnZ('CHILD',{x:z.x-20,y:z.y-20});
  }
  if (z.type==='BOSS') {
    puff(z.x,z.y,40,'#FF4000',130);
    if (dist(z,pl)<140) hurtPlayer(25,false);
  }
}

function dropBattery(near) {
  const a = Math.random()*Math.PI*2;
  pickups.push({
    x: clamp(near.x+Math.cos(a)*80, 20, WW-20),
    y: clamp(near.y+Math.sin(a)*80, 20, WH-20),
    type:'bat'
  });
}

// ── UPDATE ──
let last = 0;
function loop(ts) {
  const dt = Math.min((ts-last)/1000, 0.05);
  last = ts;
  update(dt);
  render();
  mouse.clicked = false;
  requestAnimationFrame(loop);
}

function update(dt) {
  if (gs==='MENU'||gs==='OVER'||gs==='WIN') return;

  // Round countdown between rounds
  if (nextRound>0) {
    nextRound-=dt;
    if (nextRound<=0) startRound(round+1);
    return;
  }

  if (announceT>0) announceT-=dt;
  roundTimer-=dt;
  if (roundTimer<=0) {
    if (round>=10) { gs='WIN'; return; }
    zombies=[]; bullets=[]; fires=[]; webs=[];
    announce='Ronda completada!  Siguiente en 4s...';
    announceT=3.8;
    nextRound=4;
    return;
  }

  // Spawn
  if (round<10) {
    spawnT-=dt;
    if (spawnT<=0) { spawnWave(); spawnT=spawnInterval; }
  }

  updatePlayer(dt);
  updateZombies(dt);
  updateBullets(dt);
  updateFires(dt);
  updatePickups(dt);
  updateParticles(dt);
  updateCam();

  if (!pl.alive) gs='OVER';
}

function updatePlayer(dt) {
  if (!pl.alive) return;
  if (pl.iframes>0) pl.iframes-=dt;
  if (pl.flashT>0)  pl.flashT-=dt;
  if (pl.trapped>0) pl.trapped-=dt;

  // Move
  let mx=0, my=0;
  if (keys['KeyW']||keys['ArrowUp'])    my=-1;
  if (keys['KeyS']||keys['ArrowDown'])  my=1;
  if (keys['KeyA']||keys['ArrowLeft'])  mx=-1;
  if (keys['KeyD']||keys['ArrowRight']) mx=1;

  if (pl.trapped>0) { mx=0; my=0; }

  if (mx!==0||my!==0) {
    const len = Math.hypot(mx,my);
    pl.x += mx/len*pl.spd*dt;
    pl.y += my/len*pl.spd*dt;
  }
  pl.x = clamp(pl.x, 15, WW-15);
  pl.y = clamp(pl.y, 15, WH-15);

  // Aim angle toward mouse (world coords)
  const wx = mouse.x + cam.x;
  const wy = mouse.y + cam.y;
  pl.angle = Math.atan2(wy-pl.y, wx-pl.x);

  // Battery drain
  pl.bat = Math.max(0, pl.bat - pl.batDrain*dt);

  // Shoot
  const w = pl.weps[pl.wi];
  if (w) {
    if (w.cd>0) w.cd-=dt;
    const shooting = w.auto ? mouse.down : mouse.clicked;
    if (shooting && pl.trapped<=0) fireWeapon();
  }
}

function updateZombies(dt) {
  for (let i=zombies.length-1; i>=0; i--) {
    const z = zombies[i];
    if (z.dead) { zombies.splice(i,1); continue; }

    // Status effects
    if (z.frozen>0) { z.frozen-=dt; continue; }
    if (z.thaw>0) {
      z.thaw-=dt;
      z.hp-=5*dt;
      if (z.hp<=0) { killZ(z); continue; }
    }
    if (z.stun>0) { z.stun-=dt; continue; }
    if (z.burning) { z.hp-=20*dt; if(z.hp<=0){killZ(z);continue;} }
    if (z.flash>0) z.flash-=dt;
    if (z.atkT>0) z.atkT-=dt;

    const dx=pl.x-z.x, dy=pl.y-z.y;
    const d=Math.hypot(dx,dy)||1;
    const nx=dx/d, ny=dy/d;

    // AI
    if (z.type==='BIGHEAD') {
      // flee
      z.x -= nx*z.spd*dt; z.y -= ny*z.spd*dt;
      z.screamT-=dt;
      if (z.screamT<=0 && d<600) {
        z.screamT=9;
        for (let s=0;s<3;s++) spawnZ('NORMAL');
        puff(z.x,z.y,15,'#FFFF00',70);
      }
    } else if (z.type==='KAMIKAZE') {
      z.x+=nx*z.spd*dt; z.y+=ny*z.spd*dt;
      if (d<45 && !z.exploded) {
        z.exploded=true;
        hurtPlayer(z.dmg,true);
        puff(z.x,z.y,22,'#FF5500',90);
        killZ(z); continue;
      }
    } else if (z.type==='SCIENTIST') {
      z.x+=nx*z.spd*dt; z.y+=ny*z.spd*dt;
      z.throwT-=dt;
      if (z.throwT<=0 && d<260) {
        z.throwT=3;
        bullets.push({x:z.x,y:z.y,vx:nx*155,vy:ny*155,type:'chem',dmg:10,life:3,player:false,col:'#80FF40',r:6});
      }
    } else if (z.type==='SPIDER') {
      z.x+=nx*z.spd*dt; z.y+=ny*z.spd*dt;
      z.webT-=dt;
      if (z.webT<=0 && d<280) {
        z.webT=4.5;
        bullets.push({x:z.x,y:z.y,vx:nx*140,vy:ny*140,type:'web',dmg:20,life:3,player:false,col:'#DDDDDD',r:6});
      }
    } else if (z.type==='PREGNANT') {
      z.x+=nx*z.spd*dt; z.y+=ny*z.spd*dt;
      z.spawnT-=dt;
      if (z.spawnT<=0) {
        z.spawnT=5;
        spawnZ('CHILD',{x:z.x+(Math.random()-0.5)*40,y:z.y+(Math.random()-0.5)*40});
      }
    } else if (z.type==='BOSS') {
      z.x+=nx*z.spd*dt; z.y+=ny*z.spd*dt;
      z.throwT-=dt; z.screamT-=dt; z.summonT-=dt; z.webT-=dt;
      if(z.throwT<=0){z.throwT=4;bullets.push({x:z.x,y:z.y,vx:nx*150,vy:ny*150,type:'chem',dmg:10,life:3,player:false,col:'#80FF40',r:7});}
      if(z.screamT<=0){z.screamT=11;for(let s=0;s<4;s++) spawnZ('NORMAL');puff(z.x,z.y,18,'#FFFF00',80);}
      if(z.summonT<=0){z.summonT=9;for(let s=0;s<4;s++){const a2=Math.random()*Math.PI*2;spawnZ('NORMAL',{x:z.x+Math.cos(a2)*90,y:z.y+Math.sin(a2)*90});}puff(z.x,z.y,20,'#00FF80',70);}
      if(z.webT<=0&&d<320){z.webT=6;bullets.push({x:z.x,y:z.y,vx:nx*130,vy:ny*130,type:'web',dmg:20,life:3,player:false,col:'#DDDDDD',r:9});}
    } else {
      // default: chase
      z.x+=nx*z.spd*dt; z.y+=ny*z.spd*dt;
    }

    z.x=clamp(z.x,10,WW-10); z.y=clamp(z.y,10,WH-10);
    z.angle=Math.atan2(dy,dx);

    // Melee
    if (d < z.r+pl.r+6 && z.atkT<=0 && z.type!=='KAMIKAZE' && z.type!=='BIGHEAD') {
      hurtPlayer(z.dmg, true);
      z.atkT=1.1;
    }
  }
}

function updateBullets(dt) {
  for (let i=bullets.length-1; i>=0; i--) {
    const b=bullets[i];
    b.life-=dt;
    if(b.life<=0){bullets.splice(i,1);continue;}
    b.x+=b.vx*dt; b.y+=b.vy*dt;

    if (b.player) {
      // hit zombies
      let hit=false;
      for (let j=zombies.length-1;j>=0;j--) {
        const z=zombies[j];
        if(z.dead) continue;
        if(dist(b,z)<z.r+b.r) {
          let dmg=b.dmg;
          if(b.type==='shotgun') {
            const d2=Math.hypot(b.x-b.bx,b.y-b.by);
            dmg=Math.max(b.dmg*0.08, b.dmg*(1-d2/180));
          }
          hurtZombie(z,dmg,b.type);
          puff(b.x,b.y,4,b.col,20);
          if(b.type!=='flame'&&b.type!=='bat') hit=true;
          if(hit) break;
        }
      }
      if(hit){bullets.splice(i,1);continue;}

      // Molotov: splat on edge of world or short life
      if(b.type==='molotov'&&b.life<0.1){
        fires.push({x:b.x,y:b.y,r:68,t:5,mt:5,dps:10});
        puff(b.x,b.y,15,'#FF5500',55);
        bullets.splice(i,1);continue;
      }
      // Rocket: explode on life end
      if(b.type==='rocket'&&b.life<0.05){
        explodeRocket(b); bullets.splice(i,1);continue;
      }
    } else {
      // Enemy bullets hit player
      if(dist(b,pl)<pl.r+b.r) {
        if(b.type==='web') {
          pl.trapped=4;
          hurtPlayer(b.dmg,false);
          webs.push({x:pl.x,y:pl.y,t:4});
        } else {
          hurtPlayer(b.dmg,true);
        }
        puff(b.x,b.y,6,b.col,22);
        bullets.splice(i,1);continue;
      }
    }
  }
}

function explodeRocket(b) {
  const aoeR=130;
  puff(b.x,b.y,38,'#FF4000',140);
  for(let j=zombies.length-1;j>=0;j--) {
    const z=zombies[j];
    if(!z.dead&&dist(b,z)<aoeR) hurtZombie(z,250,'rocket');
  }
  if(dist(b,pl)<75) hurtPlayer(90,false);
}

function updateFires(dt) {
  for(let i=fires.length-1;i>=0;i--){
    const f=fires[i];
    f.t-=dt;
    if(f.t<=0){fires.splice(i,1);continue;}
    // Damage zombies in fire
    for(const z of zombies){
      if(!z.dead&&dist(f,z)<f.r){
        z.hp-=f.dps*dt; z.burning=true; z.burnT=9999;
        if(z.hp<=0) killZ(z);
      }
    }
    if(dist(f,pl)<f.r) hurtPlayer(f.dps*dt,false);
  }
  // Web traps
  for(let i=webs.length-1;i>=0;i--){
    webs[i].t-=dt;
    if(webs[i].t<=0) webs.splice(i,1);
  }
}

function updatePickups(dt) {
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    if(dist(p,pl)<22){
      if(p.type==='med'){
        pl.hp=Math.min(pl.maxHp,pl.hp+50);
        puff(p.x,p.y,8,'#FF4040',30);
        pickups.splice(i,1);
      } else if(p.type==='bat'){
        pl.bat=Math.min(pl.batMax,pl.bat+40);
        puff(p.x,p.y,8,'#F0D020',30);
        pickups.splice(i,1);
      } else if(p.type==='wep'){
        const have=pl.weps.find(w=>w.type===p.wt);
        if(have){ if(have.ammo>=0) have.ammo=Math.min(have.maxAmmo,have.ammo+Math.floor(have.maxAmmo/2)); }
        else pl.weps.push(makeWep(p.wt));
        puff(p.x,p.y,10,'#FFFF00',35);
        pickups.splice(i,1);
      }
    }
  }
}

function updateParticles(dt) {
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=0.91; p.vy*=0.91;
    p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
}

function updateCam() {
  cam.x = clamp(pl.x - W/2, 0, WW-W);
  cam.y = clamp(pl.y - H/2, 0, WH-H);
}

// ── RENDER ──
let frame=0;
function render() {
  frame++;
  ctx.clearRect(0,0,W,H);

  if(gs==='MENU'){ drawMenu(); return; }
  if(gs==='OVER'){  drawOver(); return; }
  if(gs==='WIN'){   drawWin();  return; }

  // World
  ctx.save();
  ctx.translate(-cam.x, -cam.y);
  drawWorld();
  ctx.restore();

  // Darkness + lantern (screen coords)
  drawDarkness();

  // HUD on top
  drawHUD();
  if(announceT>0) drawAnnounce();
}

// ── WORLD DRAW ──
function drawWorld() {
  // Ground
  for(let tx=Math.floor(cam.x/48);tx<(cam.x+W)/48+1;tx++){
    for(let ty=Math.floor(cam.y/48);ty<(cam.y+H)/48+1;ty++){
      const seed=(tx*397+ty*211)%100;
      ctx.fillStyle = seed<8?'#3A2810':seed<18?'#243015':'#1C2C10';
      ctx.fillRect(tx*48,ty*48,48,48);
    }
  }
  // Grass detail
  ctx.fillStyle='#2A3A14';
  for(let i=0;i<120;i++){
    const gx=(i*173+37)%WW, gy=(i*251+89)%WH;
    if(gx>cam.x-10&&gx<cam.x+W+10&&gy>cam.y-10&&gy<cam.y+H+10)
      ctx.fillRect(gx,gy,3,5);
  }

  // Road
  ctx.fillStyle='#404040';
  ctx.fillRect(480,0,50,WH);
  ctx.fillRect(0,480,WW,50);
  ctx.fillStyle='#EEEE00';
  for(let i=0;i<20;i++){
    ctx.fillRect(503,i*100,4,50);
    ctx.fillRect(i*100,503,50,4);
  }

  // Buildings
  for(const b of buildings) {
    ctx.fillStyle=b.c;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    // Roof edge
    ctx.fillStyle=lighten(b.c,30);
    ctx.fillRect(b.x,b.y,b.w,14);
    // Walls
    ctx.fillStyle=darken(b.c,20);
    ctx.fillRect(b.x+2,b.y+14,b.w-4,b.h-16);
    // Door
    ctx.fillStyle='#1A1008';
    const dw=22,dh=32;
    ctx.fillRect(b.x+b.w/2-dw/2,b.y+b.h-dh,dw,dh);
    // Windows
    ctx.fillStyle='#0A1520';
    ctx.fillRect(b.x+18,b.y+22,22,18);
    ctx.fillRect(b.x+b.w-40,b.y+22,22,18);
    ctx.strokeStyle='#8B7355';ctx.lineWidth=2;
    ctx.strokeRect(b.x+18,b.y+22,22,18);
    ctx.strokeRect(b.x+b.w-40,b.y+22,22,18);
    // Border
    ctx.strokeStyle='#111';ctx.lineWidth=2;
    ctx.strokeRect(b.x,b.y,b.w,b.h);
    if(b.type==='gas'){
      ctx.fillStyle='#FF2020';ctx.font='bold 16px monospace';ctx.textAlign='center';
      ctx.fillText('⛽ GAS',b.x+b.w/2,b.y+b.h/2+6);
    }
  }

  // Trees
  for(const t of trees){
    if(t.x<cam.x-40||t.x>cam.x+W+40||t.y<cam.y-40||t.y>cam.y+H+40) continue;
    ctx.fillStyle='#5A3A1A';ctx.fillRect(t.x-5,t.y-6,10,18);
    ctx.fillStyle='#1A3A0C';ctx.fillRect(t.x-15,t.y-26,30,22);
    ctx.fillStyle='#244A10';ctx.fillRect(t.x-11,t.y-40,22,18);
    ctx.fillStyle='#2A5A14';ctx.fillRect(t.x-6, t.y-52,12,14);
    ctx.fillStyle='#306018';ctx.fillRect(t.x-4, t.y-36,5,12);
  }

  // Fire zones
  for(const f of fires){
    const t=f.t/f.mt;
    for(let fi=0;fi<5;fi++){
      const fa=fi/5*Math.PI*2+frame*0.08;
      const fr=f.r*(0.5+0.5*Math.random());
      ctx.fillStyle=`rgba(255,${80+Math.random()*60|0},10,0.38)`;
      ctx.beginPath();ctx.arc(f.x+Math.cos(fa)*fr*0.4,f.y+Math.sin(fa)*fr*0.4,12+Math.random()*10,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle=`rgba(255,80,10,0.18)`;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();
  }

  // Web traps on player
  if(webs.length>0&&pl.trapped>0){
    ctx.strokeStyle='rgba(200,200,200,0.5)';ctx.lineWidth=1.5;
    for(let wi=0;wi<8;wi++){
      const wa=wi*Math.PI/4;
      ctx.beginPath();ctx.moveTo(pl.x,pl.y);ctx.lineTo(pl.x+Math.cos(wa)*40,pl.y+Math.sin(wa)*40);ctx.stroke();
    }
    for(let wr=10;wr<=40;wr+=12){ctx.beginPath();ctx.arc(pl.x,pl.y,wr,0,Math.PI*2);ctx.stroke();}
  }

  // Pickups
  for(const p of pickups){
    if(p.x<cam.x-30||p.x>cam.x+W+30||p.y<cam.y-30||p.y>cam.y+H+30) continue;
    const bob=Math.sin(frame*0.07+p.x*0.01)*2.5;
    ctx.save();ctx.translate(p.x,p.y+bob);
    if(p.type==='med'){
      ctx.fillStyle='#CC1111';ctx.fillRect(-10,-10,20,20);
      ctx.fillStyle='#FFF';ctx.fillRect(-3,-8,6,16);ctx.fillRect(-8,-3,16,6);
      ctx.strokeStyle='#FF3333';ctx.lineWidth=1;ctx.strokeRect(-10,-10,20,20);
    } else if(p.type==='bat'){
      ctx.fillStyle='#222';ctx.fillRect(-6,-10,12,20);
      ctx.fillStyle='#F0D020';ctx.fillRect(-4,-8,8,14);
      ctx.fillStyle='#2A2A00';ctx.fillRect(-3,-11,6,4);
      ctx.strokeStyle='#A09000';ctx.lineWidth=1;ctx.strokeRect(-6,-10,12,20);
    } else {
      const wd=WEP_DATA[p.wt];
      const glow=Math.sin(frame*0.06)*0.4+0.6;
      ctx.fillStyle=`rgba(255,255,100,${glow*0.25})`;ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=wd?wd.col:'#CCCC44';
      ctx.fillRect(-12,-5,24,10);ctx.fillRect(8,-3,6,6);
      ctx.fillStyle='#111';ctx.fillRect(-12,-8,24,4);
      ctx.fillStyle='#FFF';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText(p.wt,0,22);
    }
    ctx.restore();
  }

  // Particles
  for(const p of particles){
    ctx.save();ctx.globalAlpha=p.life/p.ml;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz*(p.life/p.ml),0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Bullets
  for(const b of bullets){
    ctx.save();ctx.globalAlpha=Math.min(1,b.life*4);
    if(b.type==='flame'){
      const t=1-b.life/0.65;
      ctx.fillStyle=t<0.5?'#FF8820':'#FF4400';
      ctx.globalAlpha*=(1-t)*0.8;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r*(1+t),0,Math.PI*2);ctx.fill();
    } else if(b.type==='molotov'){
      ctx.fillStyle='#AABB44';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#FF8020';ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
    } else if(b.type==='rocket'){
      const ra=Math.atan2(b.vy,b.vx);
      ctx.translate(b.x,b.y);ctx.rotate(ra);
      ctx.fillStyle='#FF2222';ctx.fillRect(-b.r*1.5,-b.r*0.5,b.r*3,b.r);
      ctx.fillStyle='#FF8822';ctx.fillRect(-b.r*3,-b.r*0.3,b.r*1.8,b.r*0.6);
    } else if(b.type==='ice'){
      ctx.fillStyle='#88DDFF';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#44AADD';ctx.lineWidth=2;ctx.stroke();
    } else if(b.type==='bat'){
      ctx.fillStyle='rgba(255,255,32,0.4)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#FFFF22';ctx.lineWidth=2;ctx.stroke();
    } else if(b.type==='web'){
      ctx.strokeStyle='#CCCCCC';ctx.lineWidth=1.5;
      for(let wj=0;wj<6;wj++){const wa=wj*Math.PI/3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+Math.cos(wa)*b.r*1.6,b.y+Math.sin(wa)*b.r*1.6);ctx.stroke();}
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
    } else if(b.type==='chem'){
      ctx.fillStyle='#40FF40';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    } else {
      ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=b.col+'44';ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.2,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  // Zombies
  for(const z of zombies){
    if(z.dead) continue;
    if(z.x<cam.x-80||z.x>cam.x+W+80||z.y<cam.y-80||z.y>cam.y+H+80) continue;
    drawZombie(z);
  }

  // Player
  drawPlayer();
}

function lighten(hex,amt){
  let n=parseInt(hex.slice(1),16);
  const r=Math.min(255,(n>>16)+amt), g=Math.min(255,((n>>8)&0xFF)+amt), b=Math.min(255,(n&0xFF)+amt);
  return `rgb(${r},${g},${b})`;
}
function darken(hex,amt){
  let n=parseInt(hex.slice(1),16);
  const r=Math.max(0,(n>>16)-amt), g=Math.max(0,((n>>8)&0xFF)-amt), b=Math.max(0,(n&0xFF)-amt);
  return `rgb(${r},${g},${b})`;
}

function drawZombie(z) {
  ctx.save();
  ctx.translate(z.x, z.y);
  const fl = z.flash>0;
  const s = z.r;

  // Freeze tint
  if(z.frozen>0||z.thaw>0){
    ctx.globalAlpha=z.frozen>0?0.65:0.35;
    ctx.fillStyle='#88DDFF';ctx.beginPath();ctx.arc(0,0,s+5,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  if(z.type==='BOSS') { drawBoss(s,fl); }
  else if(z.type==='FAT') { drawFat(s,fl,z); }
  else if(z.type==='ARMORED') { drawArmored(s,fl,z); }
  else if(z.type==='BIGHEAD') { drawBighead(s,fl); }
  else if(z.type==='PREGNANT') { drawPregnant(s,fl); }
  else if(z.type==='SCIENTIST') { drawScientist(s,fl); }
  else if(z.type==='KAMIKAZE') { drawKamikaze(s,fl); }
  else if(z.type==='SPIDER') { drawSpider(s,fl); }
  else if(z.type==='CHILD') { drawBasicZ(s*0.65,fl,'#3A7A4A','#5A9A6A'); }
  else { drawBasicZ(s,fl,'#3A7A2A','#5A9A4A'); }

  // HP bar
  if(z.hp<z.maxHp){
    const bw=s*2.4;
    ctx.fillStyle='#300';ctx.fillRect(-bw/2,-s-14,bw,5);
    ctx.fillStyle=z.hp/z.maxHp>0.5?'#0F0':z.hp/z.maxHp>0.25?'#FF0':'#F00';
    ctx.fillRect(-bw/2,-s-14,bw*(z.hp/z.maxHp),5);
  }
  if(z.stun>0){ctx.fillStyle='#FFFF00';ctx.font=`${11*z.sc}px mono`;ctx.textAlign='center';ctx.fillText('⚡',0,-s-18);}
  ctx.restore();
}

function drawBasicZ(s,fl,bc,hc){
  ctx.fillStyle=fl?'#FF5555':bc;
  ctx.fillRect(-s*0.75,-s*0.5,s*1.5,s*1.2);
  ctx.fillStyle=fl?'#FF8888':hc;
  ctx.fillRect(-s*0.6,-s*1.15,s*1.2,s*0.9);
  ctx.fillStyle='#CC0000';
  ctx.fillRect(-s*0.38,-s*0.88,s*0.22,s*0.2);
  ctx.fillRect(s*0.14,-s*0.88,s*0.22,s*0.2);
  ctx.fillStyle='#1A0808';ctx.fillRect(-s*0.28,-s*0.48,s*0.56,s*0.18);
  ctx.fillStyle=fl?'#FF5555':bc;
  ctx.fillRect(-s*1.1,-s*0.3,s*0.42,s*0.32);
  ctx.fillRect(s*0.68,-s*0.3,s*0.42,s*0.32);
  ctx.strokeStyle='#0A0A0A';ctx.lineWidth=1;
  ctx.strokeRect(-s*0.75,-s*0.5,s*1.5,s*1.2);
  ctx.strokeRect(-s*0.6,-s*1.15,s*1.2,s*0.9);
}

function drawFat(s,fl,z){
  ctx.fillStyle=fl?'#FF5555':'#2A5A1A';
  ctx.beginPath();ctx.ellipse(0,s*0.1,s*1.25,s,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#0A0A0A';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=fl?'#FF8888':'#4A7A3A';
  ctx.beginPath();ctx.ellipse(0,-s*0.95,s*0.8,s*0.72,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#0A0A0A';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#CC0000';
  ctx.fillRect(-s*0.35,-s*1.12,s*0.22,s*0.22);ctx.fillRect(s*0.12,-s*1.12,s*0.22,s*0.22);
  ctx.fillStyle='#1A0808';ctx.fillRect(-s*0.32,-s*0.7,s*0.64,s*0.2);
  // Warning stripes
  ctx.fillStyle='rgba(255,80,10,0.28)';ctx.beginPath();ctx.arc(0,s*0.1,s*1.25,0,Math.PI*2);ctx.fill();
}

function drawArmored(s,fl,z){
  drawBasicZ(s,fl,'#3A4A6A','#5A6A8A');
  if(!z.armorOff){
    ctx.fillStyle=fl?'#8888FF':'#445577';
    ctx.fillRect(-s*0.85,-s*0.65,s*1.7,s*1.35);
    ctx.strokeStyle='#334466';ctx.lineWidth=1;ctx.strokeRect(-s*0.85,-s*0.65,s*1.7,s*1.35);
    ctx.fillStyle='#556688';ctx.fillRect(-s*0.65,-s*0.45,s*0.44,s*0.85);ctx.fillRect(s*0.2,-s*0.45,s*0.44,s*0.85);
    // Helmet
    ctx.fillStyle=fl?'#8888FF':'#445577';
    ctx.beginPath();ctx.ellipse(0,-s*0.82,s*0.72,s*0.58,0,Math.PI,Math.PI*2);ctx.fill();
    ctx.fillRect(-s*0.75,-s*1.05,s*1.5,s*0.22);
    ctx.strokeStyle='#334466';ctx.lineWidth=1;ctx.stroke();
    // Hits remaining
    ctx.fillStyle='#FFFFFF';ctx.font=`bold ${9}px mono`;ctx.textAlign='center';
    ctx.fillText(z.armorHits+'🛡',0,-s-18);
  }
}

function drawBighead(s,fl){
  // Small body
  ctx.fillStyle=fl?'#FF5555':'#3A7A2A';ctx.fillRect(-s*0.55,-s*0.1,s*1.1,s*0.9);
  // HUGE head
  ctx.fillStyle=fl?'#FFAAAA':'#AAAA2A';
  ctx.beginPath();ctx.ellipse(0,-s*0.85,s*1.15,s*1.05,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#0A0A0A';ctx.lineWidth=1;ctx.stroke();
  // Giant mouth
  ctx.fillStyle='#1A0808';ctx.beginPath();ctx.ellipse(0,-s*0.5,s*0.75,s*0.38,0,0,Math.PI);ctx.fill();
  ctx.fillStyle='#EEEEBB';
  for(let ti=-2;ti<=2;ti++) ctx.fillRect(ti*s*0.26-s*0.1,-s*0.52,s*0.18,s*0.26);
  ctx.fillStyle='#FF0000';
  ctx.beginPath();ctx.arc(-s*0.42,-s*1.02,s*0.22,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.42,-s*1.02,s*0.22,0,Math.PI*2);ctx.fill();
}

function drawSpider(s,fl){

  ctx.strokeStyle=fl?'#FF5555':'#3A3A5A';ctx.lineWidth=2;
  const arms=[[-s*0.5,-s*0.2,-s*1.7,-s*0.6],[s*0.5,-s*0.2,s*1.7,-s*0.6],
               [-s*0.5,s*0.1,-s*1.7,s*0.5],[s*0.5,s*0.1,s*1.7,s*0.5],
               [-s*0.5,-s*0.05,-s*1.6,s*0.8],[s*0.5,-s*0.05,s*1.6,s*0.8],
               [-s*0.4,s*0.3,-s*1.4,s*1.1],[s*0.4,s*0.3,s*1.4,s*1.1]];

  [[-s*0.3,-s*0.9],[s*0.3,-s*0.9],[-s*0.1,-s*0.72],[s*0.1,-s*0.72]].forEach(([ex,ey])=>{

function drawBoss(s,fl){
  // Deformed giant body
  ctx.fillStyle=fl?'#44FF44':'#1A3A0A';
  ctx.beginPath();
  ctx.moveTo(-s*0.95,s*0.85);ctx.lineTo(-s*1.3,-s*0.25);
  ctx.lineTo(-s*0.8,-s*0.9);ctx.lineTo(0,-s*1.2);
  ctx.lineTo(s*0.8,-s*0.9);ctx.lineTo(s*1.35,-s*0.2);
  ctx.lineTo(s*0.95,s*0.85);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#0A0A0A';ctx.lineWidth=2;ctx.stroke();
  // Head
  ctx.fillStyle=fl?'#55FF55':'#3A6A2A';
  ctx.beginPath();ctx.ellipse(0,-s*1.5,s*0.95,s*0.85,0.15,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#0A0A0A';ctx.lineWidth=1;ctx.stroke();
  // 3 eyes
  ['#FF0000','#FF4400','#FF0044'].forEach((ec,ei)=>{
    ctx.fillStyle=ec;ctx.beginPath();ctx.arc((ei-1)*s*0.44,-s*1.62,s*0.17,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFFF00';ctx.beginPath();ctx.arc((ei-1)*s*0.44,-s*1.62,s*0.07,0,Math.PI*2);ctx.fill();
  });
  // Mouth
  ctx.fillStyle='#1A0808';ctx.beginPath();ctx.ellipse(0,-s*1.22,s*0.58,s*0.3,0,0,Math.PI);ctx.fill();
  ctx.fillStyle='#EEEEBB';for(let ti=-2;ti<=2;ti++) ctx.fillRect(ti*s*0.22-s*0.09,-s*1.25,s*0.16,s*0.26);
  // Extra limbs
  ctx.strokeStyle=fl?'#44FF44':'#2A5A1A';ctx.lineWidth=6;
  [[-s*1.2,s*0.5,-s*2.0,s*1.3],[s*1.2,s*0.5,s*2.0,s*1.3],
   [-s*1.0,-s*0.3,-s*1.8,-s*0.9],[s*1.0,-s*0.3,s*1.8,-s*0.9]].forEach(([x1,y1,x2,y2])=>{
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  });
  // Aura glow
  const g=ctx.createRadialGradient(0,0,s*0.5,0,0,s*3);
  g.addColorStop(0,'rgba(40,120,20,0)');g.addColorStop(1,'rgba(40,120,20,0.18)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*3,0,Math.PI*2);ctx.fill();
}

function drawPlayer() {
  if(!pl.alive) return;
  const fl = pl.flashT>0;
  ctx.save();
  ctx.translate(pl.x, pl.y);
  ctx.rotate(pl.angle + Math.PI/2);

  const s = pl.r;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(0,s*0.7,s*0.9,s*0.3,0,0,Math.PI*2);ctx.fill();

  // Legs
  ctx.fillStyle=fl?'#FF8888':'#1A2A40';
  ctx.fillRect(-s*0.6, s*0.15, s*0.45, s*0.95);
  ctx.fillRect( s*0.15, s*0.15, s*0.45, s*0.95);

  // Boots
  ctx.fillStyle=fl?'#FF6666':'#0A1A2A';
  ctx.fillRect(-s*0.65, s*0.85, s*0.5, s*0.3);
  ctx.fillRect( s*0.15, s*0.85, s*0.5, s*0.3);

  // Torso
  ctx.fillStyle=fl?'#88FF88':'#2A5A2A';
  ctx.fillRect(-s*0.7, -s*0.25, s*1.4, s*0.55);

  // Jacket detail
  ctx.fillStyle=fl?'#66CC66':'#1A4A1A';
  ctx.fillRect(-s*0.6,-s*0.2,s*0.52,s*0.45);
  ctx.fillRect( s*0.08,-s*0.2,s*0.52,s*0.45);

  // Arms
  ctx.fillStyle=fl?'#88FF88':'#2A5A2A';
  ctx.fillRect(-s*1.05,-s*0.2,s*0.4,s*0.5);
  ctx.fillRect( s*0.65,-s*0.2,s*0.4,s*0.5);

  // Head
  ctx.fillStyle=fl?'#FFBBBB':'#C8956A';
  ctx.fillRect(-s*0.52,-s*1.12,s*1.04,s*0.88);

  // Hair
  ctx.fillStyle=fl?'#FF9999':'#3A2A1A';
  ctx.fillRect(-s*0.52,-s*1.12,s*1.04,s*0.28);
  ctx.fillRect(-s*0.52,-s*1.12,s*0.2,s*0.88);

  // Eyes
  ctx.fillStyle='#1A1A2A';
  ctx.fillRect(-s*0.3,-s*0.82,s*0.2,s*0.18);
  ctx.fillRect( s*0.1,-s*0.82,s*0.2,s*0.18);
  ctx.fillStyle='#FFFFFF';
  ctx.fillRect(-s*0.26,-s*0.84,s*0.08,s*0.1);
  ctx.fillRect( s*0.14,-s*0.84,s*0.08,s*0.1);

  // Weapon
  const w=pl.weps[pl.wi];
  if(w){
    if(w.type==='BAT'){
      ctx.fillStyle='#888';ctx.fillRect(s*0.55,-s*0.12,s*0.3,s*1.4);
      ctx.fillStyle='#FFFF22';ctx.fillRect(s*0.5,-s*0.14,s*0.4,s*0.26);
    } else if(w.type==='FLAME'){
      ctx.fillStyle='#885522';ctx.fillRect(s*0.52,-s*0.18,s*0.45,s*0.3);
      ctx.fillStyle='#FF5500';ctx.fillRect(s*0.97,-s*0.1,s*0.5,s*0.18);
    } else if(w.type==='SHOTGUN'){
      ctx.fillStyle='#774422';ctx.fillRect(s*0.5,-s*0.14,s*0.85,s*0.28);
      ctx.fillStyle='#553311';ctx.fillRect(s*0.5,-s*0.18,s*0.3,s*0.36);
    } else if(w.type==='RPG'){
      ctx.fillStyle='#225522';ctx.fillRect(s*0.5,-s*0.16,s*0.95,s*0.32);
      ctx.fillStyle='#FF2222';ctx.fillRect(s*1.45,-s*0.12,s*0.2,s*0.24);
    } else {
      ctx.fillStyle=w.col||'#888';ctx.fillRect(s*0.52,-s*0.13,s*0.75,s*0.26);
    }
  }

  ctx.restore();
}

// ── DARKNESS / LANTERN ──
function drawDarkness() {
  const bPct = pl.bat / pl.batMax;
  const px = pl.x - cam.x;
  const py = pl.y - cam.y;
  const angle = pl.angle;

  dctx.clearRect(0,0,W,H);

  // Full darkness
  dctx.fillStyle = 'rgba(0,0,12,0.93)';
  dctx.fillRect(0,0,W,H);

  // Cut out lantern cone with destination-out
  dctx.globalCompositeOperation = 'destination-out';

  if (bPct > 0) {
    const coneLen = 60 + bPct * 320;
    const halfA   = (0.45 + bPct * 0.22) * Math.PI;

    const grad = dctx.createRadialGradient(px,py,0, px,py,coneLen);
    grad.addColorStop(0,   'rgba(0,0,0,1)');
    grad.addColorStop(0.55,'rgba(0,0,0,0.9)');
    grad.addColorStop(0.88,'rgba(0,0,0,0.35)');
    grad.addColorStop(1,   'rgba(0,0,0,0)');
    dctx.fillStyle = grad;
    dctx.beginPath();
    dctx.moveTo(px,py);
    dctx.arc(px,py,coneLen, angle-halfA/2, angle+halfA/2);
    dctx.closePath();
    dctx.fill();

    // Small ambient circle around player
    const aGrad = dctx.createRadialGradient(px,py,0, px,py,40);
    aGrad.addColorStop(0,'rgba(0,0,0,0.7)');
    aGrad.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=aGrad;
    dctx.beginPath();dctx.arc(px,py,40,0,Math.PI*2);dctx.fill();
  } else {
    // No battery: only tiny glow
    const aGrad = dctx.createRadialGradient(px,py,0,px,py,24);
    aGrad.addColorStop(0,'rgba(0,0,0,0.5)');
    aGrad.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=aGrad;
    dctx.beginPath();dctx.arc(px,py,24,0,Math.PI*2);dctx.fill();
  }

  dctx.globalCompositeOperation = 'source-over';

  // Draw darkness onto main canvas
  ctx.drawImage(dark, 0, 0);

  // Warm light tint on top (screen blend)
  if (bPct > 0) {
    const coneLen2 = 60 + bPct*320;
    const halfA2   = (0.45 + bPct*0.22)*Math.PI;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const tint = ctx.createRadialGradient(px,py,0,px,py,coneLen2);
    tint.addColorStop(0,`rgba(255,220,140,${bPct*0.13})`);
    tint.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=tint;
    ctx.beginPath();ctx.moveTo(px,py);
    ctx.arc(px,py,coneLen2,angle-halfA2/2,angle+halfA2/2);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }

  // Low battery flicker
  if (bPct<0.2&&bPct>0) {
    const pulse = Math.sin(frame*0.18)*0.5+0.5;
    ctx.fillStyle=`rgba(255,60,0,${pulse*0.13})`;
    ctx.fillRect(0,0,W,H);
  }
}

// ── HUD ──
function drawHUD() {
  // Top bar
  ctx.fillStyle='rgba(0,0,0,0.78)';
  ctx.fillRect(0,0,W,58);

  // HP
  ctx.fillStyle='#1A0000';ctx.fillRect(10,8,200,18);
  const hp=pl.hp/pl.maxHp;
  ctx.fillStyle=hp>0.5?'#00CC00':hp>0.25?'#CCCC00':'#CC0000';
  ctx.fillRect(10,8,200*hp,18);
  ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.strokeRect(10,8,200,18);
  ctx.fillStyle='#FFF';ctx.font='bold 11px monospace';ctx.textAlign='left';
  ctx.fillText(`❤ ${Math.ceil(pl.hp)} / ${pl.maxHp}`, 14, 21);

  // Battery
  const bp=pl.bat/pl.batMax;
  ctx.fillStyle='#1A1A00';ctx.fillRect(10,30,200,14);
  ctx.fillStyle=bp>0.5?'#F0D020':bp>0.25?'#F08020':'#F02020';
  ctx.fillRect(10,30,200*bp,14);
  ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.strokeRect(10,30,200,14);
  ctx.fillStyle='#FFF';ctx.font='bold 10px monospace';
  ctx.fillText(`🔦 ${Math.ceil(pl.bat)}%`, 14, 41);

  // Round / Timer
  const mins=Math.floor(roundTimer/60)|0, secs=Math.floor(roundTimer%60)|0;
  ctx.textAlign='center';
  ctx.fillStyle='#FFF';ctx.font='bold 18px monospace';
  ctx.fillText(`RONDA ${round} / 10`, W/2, 22);
  ctx.fillStyle=roundTimer<30?'#FF4040':'#F0D020';ctx.font='bold 22px monospace';
  ctx.fillText(`${mins}:${secs.toString().padStart(2,'0')}`, W/2, 46);

  // Kills
  ctx.textAlign='right';ctx.fillStyle='#FFF';ctx.font='bold 13px monospace';
  ctx.fillText(`💀 ${totalKills}`, W-10, 22);
  ctx.fillStyle='#AAA';ctx.font='11px monospace';
  ctx.fillText(`ronda: ${roundKills}`, W-10, 38);

  // Bottom weapon bar
  ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,H-54,W,54);
  const sw=58;
  const startX = W/2 - pl.weps.length*sw/2;
  for(let wi=0;wi<pl.weps.length;wi++){
    const w=pl.weps[wi];
    const sx=startX+wi*sw;
    const act=wi===pl.wi;
    ctx.fillStyle=act?'rgba(80,120,255,0.4)':'rgba(0,0,0,0.5)';
    ctx.fillRect(sx,H-52,sw-2,52);
    if(act){ctx.strokeStyle='#6699FF';ctx.lineWidth=2;ctx.strokeRect(sx,H-52,sw-2,52);}
    ctx.fillStyle=act?'#FFF':'#AAA';
    ctx.font=`${act?17:13}px monospace`;ctx.textAlign='center';
    ctx.fillText(w.icon||'?',sx+sw/2-1,H-30);
    ctx.fillStyle='#999';ctx.font='8px monospace';ctx.fillText(wi+1,sx+4,H-40);
    ctx.fillStyle=w.ammo===0?'#FF4040':'#CCC';ctx.font='9px monospace';
    ctx.fillText(w.ammo<0?'∞':w.ammo, sx+sw/2-1, H-12);
  }
  // Active weapon info
  const w=pl.weps[pl.wi];
  if(w){
    ctx.textAlign='left';ctx.fillStyle='#FFF';ctx.font='bold 15px monospace';
    ctx.fillText(`${w.icon} ${w.name}`, 12, H-34);
    ctx.fillStyle='#CCC';ctx.font='12px monospace';
    ctx.fillText(`Munición: ${w.ammo<0?'∞':w.ammo}/${w.ammo<0?'∞':w.maxAmmo}`, 12, H-16);
    if(w.cd>0){
      ctx.fillStyle='#333';ctx.fillRect(210,H-44,110,10);
      ctx.fillStyle='#4488FF';ctx.fillRect(210,H-44,110*(1-w.cd/w.rate),10);
    }
  }

  // Boss bar
  const boss=zombies.find(z=>z.type==='BOSS'&&!z.dead);
  if(boss){
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(W/2-200,H-115,400,32);
    ctx.fillStyle='#600';ctx.fillRect(W/2-196,H-112,392,26);
    ctx.fillStyle='#CC0000';ctx.fillRect(W/2-196,H-112,392*(boss.hp/boss.maxHp),26);
    ctx.strokeStyle='#FF2020';ctx.lineWidth=2;ctx.strokeRect(W/2-196,H-112,392,26);
    ctx.fillStyle='#FFF';ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText(`☠ PACIENTE CERO  ${Math.ceil(boss.hp)} / ${boss.maxHp}`, W/2, H-94);
  }

  // Between-round message
  if(nextRound>0){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(W/2-190,H/2-28,380,56);
    ctx.fillStyle='#F0D020';ctx.font='bold 19px monospace';ctx.textAlign='center';
    ctx.fillText(`Siguiente ronda en ${Math.ceil(nextRound)}s...`, W/2, H/2+8);
  }
}

function drawAnnounce() {

}

function drawOver() {
  ctx.fillStyle='rgba(0,0,0,0.96)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#CC0000';ctx.font='bold 62px monospace';ctx.textAlign='center';
  ctx.fillText('GAME OVER',W/2,190);
  ctx.fillStyle='#FFF';ctx.font='21px monospace';
  ctx.fillText(`Llegaste a la Ronda ${round} / 10`,W/2,260);
  ctx.fillStyle='#AAA';ctx.font='17px monospace';
  ctx.fillText(`Zombies eliminados: ${totalKills}`,W/2,300);
  const bx=W/2-115,by=360,bw=230,bh=52;
  const mh=mouse.x>bx&&mouse.x<bx+bw&&mouse.y>by&&mouse.y<by+bh;
  ctx.fillStyle=mh?'#551111':'#330808';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#CC2020';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#FFF';ctx.font='bold 22px monospace';ctx.textAlign='center';
  ctx.fillText('↺  REINTENTAR',W/2,by+34);
  if(mouse.clicked&&mh) initGame();
}

function drawWin() {
  ctx.fillStyle='rgba(0,0,0,0.96)';ctx.fillRect(0,0,W,H);
  for(let si=0;si<55;si++){
    const sx=(si*137)%W,sy=(si*97)%H,tw=Math.sin(frame*0.05+si)*0.5+0.5;
    ctx.fillStyle=`rgba(255,255,200,${tw*0.8})`;
    ctx.beginPath();ctx.arc(sx,sy,1+tw,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#F0D020';ctx.shadowColor='#F0D020';ctx.shadowBlur=22;
  ctx.font='bold 54px monospace';ctx.textAlign='center';ctx.fillText('¡VICTORIA!',W/2,155);
  ctx.shadowBlur=0;
  ctx.fillStyle='#FFF';ctx.font='21px monospace';ctx.fillText('Sobreviviste las 10 rondas',W/2,215);
  ctx.fillStyle='#00CC00';ctx.font='19px monospace';ctx.fillText('¡Paciente Cero eliminado!',W/2,255);
  ctx.fillStyle='#AAA';ctx.font='17px monospace';ctx.fillText(`Total eliminados: ${totalKills}`,W/2,295);
  const bx=W/2-125,by=355,bw=250,bh=52;
  const mh=mouse.x>bx&&mouse.x<bx+bw&&mouse.y>by&&mouse.y<by+bh;
  ctx.fillStyle=mh?'#115511':'#0A330A';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#22CC22';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#FFF';ctx.font='bold 22px monospace';ctx.textAlign='center';
  ctx.fillText('▶  JUGAR DE NUEVO',W/2,by+34);
  if(mouse.clicked&&mh) initGame();
}

// ── INIT ──
function initGame() {
  buildMap();
  initPlayer();
  placePicks();
  zombies=[];bullets=[];particles=[];fires=[];webs=[];
  round=0;totalKills=0;roundKills=0;killBattery=0;
  nextRound=0;announceT=0;
  cam={x:0,y:0};
  gs='PLAY';
  startRound(1);
}

buildMap();
gs='MENU';
requestAnimationFrame(loop);
</script>
